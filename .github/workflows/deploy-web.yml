name: Deploy web

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check deploy secret is configured
        id: check-secret
        run: echo "has_secret=${{ secrets.FIREBASE_SERVICE_ACCOUNT_KBC_APP_3307B != '' }}" >> "$GITHUB_OUTPUT"

      # PRs get a preview channel that expires on its own; merges to main
      # deploy live. Both only ever touch the "web" hosting target — the
      # admin-web/ site is untouched by this workflow. Skipped (not failed)
      # until FIREBASE_SERVICE_ACCOUNT_KBC_APP_3307B is set — see web/CLAUDE.md.
      - name: Deploy preview channel (PR)
        if: github.event_name == 'pull_request' && steps.check-secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KBC_APP_3307B }}'
          projectId: kbc-app-3307b
          target: web

      - name: Deploy live (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KBC_APP_3307B }}'
          projectId: kbc-app-3307b
          target: web
          channelId: live

      - name: Deploy skipped — missing secret
        if: steps.check-secret.outputs.has_secret != 'true'
        run: |
          echo "::warning::FIREBASE_SERVICE_ACCOUNT_KBC_APP_3307B is not set — skipping deploy. See web/CLAUDE.md for setup steps."
