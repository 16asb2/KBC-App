name: Build and Distribute to Firebase

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Preview
    type: build
    params:
      platform: android
      profile: preview

  distribute:
    name: Upload to Firebase App Distribution
    needs: [build]
    steps:
      - name: Write service account credentials
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json" >> $EAS_ENV
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Download and upload to Firebase App Distribution
        run: |
          curl -L "${{ needs.build.outputs.artifact_url }}" -o /tmp/app.apk
          npx firebase-tools appdistribution:distribute /tmp/app.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "kbc-friends" \
            --release-notes "$(git log -1 --pretty=%B)"
